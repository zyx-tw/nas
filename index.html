<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <title>NAS</title>
    <script>
      try {
        if (localStorage.getItem("task-web-theme") === "light") {
          document.documentElement.classList.replace("dark", "light");
        }
      } catch {}
      document.documentElement.style.colorScheme = document.documentElement.classList.contains("light") ? "light" : "dark";
    </script>
    <!-- Maple Mono NF CN from the design system; the bundler drops a CSS @import of an external URL. -->
    <link rel="stylesheet" href="https://ui.zyx.tw/fonts/maple-mono-nf-cn.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
